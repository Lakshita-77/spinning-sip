<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cafe - Login & Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&display=swap" rel="stylesheet">
    <style>
        body {
            font-family:"Akaya Kanadaka", serif;
            background-color: #f8f1e4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #ffffff;
            width: 400px;
            padding: 20px 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            text-align: center;
        }

        .login-container h2 {
            color: #6b4226;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .login-container p {
            color: #8c6d52;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .login-container label {
            display: block;
            color: #6b4226;
            font-size: 14px;
            margin-bottom: 5px;
            text-align: left;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .login-container button {
            background-color: #6b4226;
            color: #ffffff;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        .login-container button:hover {
            background-color: #5a3620;
        }

        .login-container .link {
            margin-top: 10px;
            font-size: 14px;
            color: #6b4226;
        }

        .login-container .link a {
            color: #6b4226;
            text-decoration: none;
        }

        .login-container .link a:hover {
            text-decoration: underline;
        }

        .logo {
            width: 80px;
            margin: 0 auto 15px auto;
        }

        .logo img {
            width: 100%;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="logo.jpg" alt="">
        </div>
        <h2>Join the Coffee Club</h2>
        <p>Sign up to receive the latest updates, offers, and cafe events!</p>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            
            <button type="submit"><a href="thank.html">Login</a></button>
        </form>
   
        <p class="link">Already have an account? <a href="signup.html">Sign up here</a></p>
        
    </div>
</body>
</html>
