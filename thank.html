<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&display=swap" rel="stylesheet">
  <title>Thank You</title>
  <style>
    body {
      font-family:"Akaya Kanadaka", serif;
      margin: 0;
      padding: 0;
      background-image: url("back3.jpg");
      color: #4a4a4a;
      text-align: center;
    }

    .thank-you-section {
      max-width: 600px;
      margin: 100px auto;
      padding: 40px 20px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: #6b4e26;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin: 15px 0;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #6b4e26;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.2s;
    }

    a:hover {
      background-color: #543a1c;
      transform: scale(1.05);
    }

    .thank-you-icon {
      font-size: 50px;
      color: #6b4e26;
      margin-bottom: 20px;
    }

    .thank-you-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: url('https://images.unsplash.com/photo-1560807707-8cc77767d783?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=60') center/cover no-repeat;
      opacity: 0.1;
    }
  </style>
</head>
<body>
  <div class="thank-you-bg"></div>
  <section class="thank-you-section">
    <div class="thank-you-icon">☕</div>
    <h2>Thank You!</h2>
    <p>Your message has been sent successfully.</p>
    <p>We appreciate your time and will get back to you shortly.</p>
    <a href="index.html">Return to Home</a>
  </section>
</body>
</html>
